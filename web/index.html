<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SplitChunkAssistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">SC</span>
      <h1>SplitChunkAssistant</h1>
      <span class="phase" id="phase">P1</span>
    </div>
    <div class="status" id="status">加载中…</div>
    <div class="actions">
      <button id="btn-refresh" type="button" class="btn">刷新</button>
      <button id="btn-settings" type="button" class="btn">⚙ 设置</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" aria-label="文件列表">
      <div class="search-row">
        <input id="search" type="search" placeholder="搜索法规名 / 分组…" autocomplete="off" aria-label="搜索法规">
      </div>
      <div class="stats" id="stats"></div>
      <nav class="tree" id="tree" aria-label="文件列表"></nav>
    </aside>

    <section class="source-pane" aria-label="原文">
      <header class="pane-head">
        <div class="pane-title" id="source-title">原文</div>
        <div class="pane-meta" id="source-meta">选择左侧文件开始</div>
        <label class="lane-toggle" title="把每个切片覆盖的原文行范围画成左侧竖条（点击竖条可选中切片）">
          <input type="checkbox" id="toggle-lanes" checked> 范围条
        </label>
      </header>
      <div class="source" id="source">
        <div class="empty">
          <h2>原文 ↔ 切片</h2>
          <p>点击左侧任意一份文件，这里会显示 Markdown 原文行；右栏是自动切好的切片。
             <b>悬停</b>任一侧都会高亮另一侧对应的区域；
             <b>在原文里拖选一段文字</b>，右侧覆盖该范围的切片会被高亮；
             左侧<b>彩色竖条</b>是每个切片覆盖的行范围（悬停看切片 id，点击选中）。</p>
        </div>
      </div>
    </section>

    <section class="chunks-pane" aria-label="切片">
      <header class="pane-head">
        <div class="pane-title">切片 <span class="count" id="chunk-count"></span></div>
        <div class="pane-meta" id="chunk-meta"></div>
      </header>
      <div class="chunks" id="chunks">
        <div class="empty"><p>尚未选择文件。</p></div>
      </div>
    </section>
  </main>

  <dialog id="settings-dialog" class="dialog">
    <form method="dialog" id="settings-form">
      <h2>⚙ 设置</h2>
      <p class="hint">修改后保存立即生效（无需重启）。切块产物目录必须包含 <code>_manifest.json</code>。</p>

      <label class="field">
        <span>切块产物目录 <code>chunks_dir</code></span>
        <input id="cfg-chunks-dir" type="text" spellcheck="false">
      </label>

      <label class="field">
        <span>FAC-RAG 根目录 <code>fac_root</code>（用于推导默认产物目录）</span>
        <input id="cfg-fac-root" type="text" spellcheck="false">
      </label>

      <label class="field">
        <span>端口 <code>port</code>（重启后生效）</span>
        <input id="cfg-port" type="number" min="1" max="65535">
      </label>

      <div class="field">
        <span>源文件根目录 <code>source_roots</code>（按分组，留空自动从 manifest 推导）</span>
        <div id="cfg-source-roots" class="source-roots"></div>
      </div>

      <div class="dialog-errors" id="cfg-errors" hidden></div>

      <div class="dialog-actions">
        <button type="button" id="btn-cancel" class="btn">取消</button>
        <button type="submit" id="btn-save" class="btn btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="/static/app.js" defer></script>
</body>
</html>
